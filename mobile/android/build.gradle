// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        // NDK r28+ defaults to 16 KB ELF alignment (Google Play page-size requirement).
        ndkVersion = "28.0.12674087"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
        // 8.8.x: bundle + uncompressed JNI get PAGE_ALIGNMENT_16K in AAB (Play 16 KB check). RN 0.76 ships 8.6 by default.
        classpath('com.android.tools.build:gradle:8.8.2')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Sentry Gradle runs sentry-cli for source maps; without org/project/auth it fails the whole build.
// eas.json sets SENTRY_DISABLE_AUTO_UPLOAD, but that env may not reach Gradle reliably on EAS.
// Re-enable uploads on EAS by setting SENTRY_FORCE_EAS_SENTRY_UPLOAD=true (and SENTRY_AUTH_TOKEN + sentry.properties).
gradle.projectsEvaluated {
    def v = System.getenv('SENTRY_DISABLE_AUTO_UPLOAD')
    def uploadDisabled = v != null && (v.equalsIgnoreCase('true') || v == '1')
    def onEas = System.getenv('EAS_BUILD') == 'true'
    def forceEasUpload = System.getenv('SENTRY_FORCE_EAS_SENTRY_UPLOAD') == 'true'
    if ((uploadDisabled || onEas) && !forceEasUpload) {
        rootProject.subprojects.each { sub ->
            sub.tasks.matching { t -> t.name.contains('_SentryUpload_') }.configureEach { t ->
                t.enabled = false
            }
        }
    }
}
