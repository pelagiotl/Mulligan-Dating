<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Heart gradient (matching app - white to pink) -->
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffe4e6" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Burgundy/wine background -->
  <rect width="1024" height="1024" fill="#8B1538" rx="180" />
  
  <!-- Large heart icon - even larger, almost filling the entire icon -->
  <g transform="translate(512, 520) scale(17)">
    <path
      d="M24 14C20.5 10.5 15.5 10.5 12 14C8.5 17.5 8.5 22.5 12 26C15.5 29.5 24 36 24 36C24 36 32.5 29.5 36 26C39.5 22.5 39.5 17.5 36 14C32.5 10.5 27.5 10.5 24 14Z"
      fill="url(#heartGradient)"
    />
  </g>
  
  <!-- "M" letter inside the heart, centered - burgundy color for contrast -->
  <text 
    x="512" 
    y="560" 
    font-size="350" 
    fill="#8B1538" 
    text-anchor="middle"
    dominant-baseline="middle"
    font-weight="bold"
    font-family="Georgia, serif"
    style="font-weight: 700; letter-spacing: -6px;">
    M
  </text>
</svg>
