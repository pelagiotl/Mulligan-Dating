<!DOCTYPE html>
<html lang="en" data-connect-shell="midnight">
  <head>
    <script>
      (function () {
        try {
          var mode = "midnight";
          var v = localStorage.getItem("mulligan-connect-shell");
          if (v === "midnight" || v === "sunny" || v === "soft") mode = v;
          document.documentElement.setAttribute("data-connect-shell", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-connect-shell", "midnight");
        }
      })();
    </script>
    <style id="boot-critical">
      html, body { margin: 0; min-height: 100dvh; }
      html[data-connect-shell="midnight"], html[data-connect-shell="midnight"] body {
        background: linear-gradient(145deg, #15102a 0%, #221a32 50%, #0f172a 100%);
      }
      html[data-connect-shell="sunny"], html[data-connect-shell="sunny"] body {
        background: linear-gradient(160deg, #fff7ed 0%, #fef3c7 45%, #ffedd5 100%);
      }
      html[data-connect-shell="soft"], html[data-connect-shell="soft"] body {
        background: linear-gradient(160deg, #f4f6ff 0%, #eef2ff 50%, #faf5ff 100%);
      }
      #root { min-height: 100dvh; }
    </style>
    <meta charset="UTF-8" />
    <!-- Google Search Console: paste the verification meta tag here when you have it -->
    <!-- Bump ?v= when replacing public/favicon.png or app-icon.png (browsers cache favicons hard). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=20260602" sizes="1024x1024" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png?v=20260602" />
    <link rel="apple-touch-icon" href="/app-icon.png?v=20260602" />
    <link rel="preload" href="/app-icon.png?v=20260602" as="image" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Match app-icon gradient start (#667eea), not burgundy UI accent — Add to Home Screen splash -->
    <meta name="theme-color" content="#667eea" />
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260602" />
    <meta name="description" content="Mulligan — Meet cool people. Actually hangout." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Mulligan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
