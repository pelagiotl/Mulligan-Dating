<!DOCTYPE html>
<html lang="en" data-connect-shell="midnight">
  <head>
    <script>
      (function () {
        try {
          var v = localStorage.getItem("mulligan-connect-shell");
          if (v === "midnight" || v === "sunny" || v === "soft") {
            document.documentElement.setAttribute("data-connect-shell", v);
          }
        } catch (e) {
          /* keep midnight default on <html> */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- Google Search Console: paste the verification meta tag here when you have it -->
    <!-- Bump ?v= when replacing public/favicon.png or app-icon.png (browsers cache favicons hard). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=20260411" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/app-icon.png?v=20260411" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8b1538" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Mulligan — Meet cool people. Actually hangout." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Mulligan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
