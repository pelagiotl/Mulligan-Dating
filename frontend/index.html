<!DOCTYPE html>
<html lang="en" data-connect-shell="midnight">
  <head>
    <script>
      (function () {
        try {
          var mode = "midnight";
          var v = localStorage.getItem("mulligan-connect-shell");
          if (v === "midnight" || v === "sunny" || v === "soft") mode = v;
          document.documentElement.setAttribute("data-connect-shell", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-connect-shell", "midnight");
        }
      })();
    </script>
    <style id="boot-critical">
      html, body { margin: 0; min-height: 100dvh; }
      html[data-connect-shell="midnight"], html[data-connect-shell="midnight"] body {
        background: linear-gradient(145deg, #15102a 0%, #221a32 50%, #0f172a 100%);
      }
      html[data-connect-shell="sunny"], html[data-connect-shell="sunny"] body {
        background: linear-gradient(160deg, #fff7ed 0%, #fef3c7 45%, #ffedd5 100%);
      }
      html[data-connect-shell="soft"], html[data-connect-shell="soft"] body {
        background: linear-gradient(160deg, #f4f6ff 0%, #eef2ff 50%, #faf5ff 100%);
      }
      #root { min-height: 100dvh; }
      #boot-fallback {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f8fafc;
      }
      #boot-fallback img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 1rem;
      }
      #boot-fallback h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      #boot-fallback p {
        margin: 0;
        opacity: 0.85;
        font-size: 0.95rem;
      }
      #boot-fallback .boot-spinner {
        width: 28px;
        height: 28px;
        margin-top: 1.25rem;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: bootSpin 0.9s linear infinite;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <meta charset="UTF-8" />
    <!-- Google Search Console: paste the verification meta tag here when you have it -->
    <!-- Bump ?v= when replacing public/favicon.png or app-icon.png (browsers cache favicons hard). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=20260603" sizes="1024x1024" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png?v=20260603" />
    <link rel="apple-touch-icon" href="/app-icon.png?v=20260603" />
    <link rel="preload" href="/app-icon.png?v=20260603" as="image" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Match app-icon gradient start (#667eea), not burgundy UI accent — Add to Home Screen splash -->
    <meta name="theme-color" content="#667eea" />
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260603" />
    <meta name="description" content="Mulligan — Meet cool people. Actually hangout." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Mulligan</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" aria-live="polite" aria-busy="true">
        <img src="/app-icon.png?v=20260603" width="72" height="72" alt="" />
        <h1>Mulligan</h1>
        <p>Loading…</p>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        var RELOAD_KEY = "mulligan:pwa-boot-reload";
        function showBootError(msg) {
          var el = document.getElementById("boot-fallback");
          if (!el) return;
          el.setAttribute("aria-busy", "false");
          el.innerHTML =
            '<img src="/app-icon.png?v=20260603" width="72" height="72" alt="" />' +
            "<h1>Mulligan</h1>" +
            "<p>" + msg + "</p>" +
            '<button type="button" id="boot-reload-btn" style="margin-top:1rem;padding:0.65rem 1.2rem;border:none;border-radius:999px;background:#fff;color:#4f46e5;font-weight:700;font-size:0.95rem;">Reload</button>';
          var btn = document.getElementById("boot-reload-btn");
          if (btn) btn.addEventListener("click", function () { window.location.reload(); });
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            try {
              if (sessionStorage.getItem(RELOAD_KEY) !== "1") {
                sessionStorage.setItem(RELOAD_KEY, "1");
                window.location.reload();
                return;
              }
            } catch (err) { /* ignore */ }
            showBootError("Update needed — tap Reload to open Mulligan.");
          }
        }, true);
        window.addEventListener("unhandledrejection", function () {
          try { sessionStorage.removeItem(RELOAD_KEY); } catch (err) { /* ignore */ }
        });
        setTimeout(function () {
          if (!document.getElementById("boot-fallback")) {
            try { sessionStorage.removeItem(RELOAD_KEY); } catch (err) { /* ignore */ }
            return;
          }
          showBootError("Still loading — tap Reload to refresh Mulligan.");
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/bootstrap.tsx"></script>
  </body>
</html>
