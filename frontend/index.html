<!DOCTYPE html>
<html lang="en" data-connect-shell="midnight">
  <head>
    <script>
      (function () {
        try {
          var mode = "midnight";
          var v = localStorage.getItem("mulligan-connect-shell");
          if (v === "midnight" || v === "sunny" || v === "soft") mode = v;
          document.documentElement.setAttribute("data-connect-shell", mode);
          var themeColors = { midnight: "#0f172a", sunny: "#ffedd5", soft: "#faf5ff" };
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", themeColors[mode] || themeColors.midnight);
        } catch (e) {
          document.documentElement.setAttribute("data-connect-shell", "midnight");
        }
      })();
    </script>
    <style id="boot-critical">
      html[data-connect-shell="midnight"] {
        --boot-bg-color: #0f172a;
        --boot-bg-gradient: linear-gradient(145deg, #15102a 0%, #221a32 50%, #0f172a 100%);
        --boot-text: #f8fafc;
      }
      html[data-connect-shell="sunny"] {
        --boot-bg-color: #ffedd5;
        --boot-bg-gradient: linear-gradient(160deg, #fff7ed 0%, #fef3c7 45%, #ffedd5 100%);
        --boot-text: #1c1917;
      }
      html[data-connect-shell="soft"] {
        --boot-bg-color: #faf5ff;
        --boot-bg-gradient: linear-gradient(160deg, #f4f6ff 0%, #eef2ff 50%, #faf5ff 100%);
        --boot-text: #1e1b4b;
      }
      html, body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background-color: var(--boot-bg-color, #0f172a);
        background-image: var(--boot-bg-gradient);
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background-color: var(--boot-bg-color, #0f172a);
        background-image: var(--boot-bg-gradient);
      }
      #boot-fallback,
      .app-route-chunk-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: 100svh;
        min-height: 100lvh;
        min-height: -webkit-fill-available;
        background-color: var(--boot-bg-color, #0f172a);
        background-image: var(--boot-bg-gradient);
        overscroll-behavior: none;
      }
      #boot-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(2rem, env(safe-area-inset-top, 0px)) max(2rem, env(safe-area-inset-right, 0px))
          max(2rem, env(safe-area-inset-bottom, 0px)) max(2rem, env(safe-area-inset-left, 0px));
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--boot-text, #f8fafc);
      }
      #boot-fallback img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 1rem;
      }
      #boot-fallback h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      #boot-fallback p {
        margin: 0;
        opacity: 0.85;
        font-size: 0.95rem;
      }
      #boot-fallback .boot-spinner,
      .app-route-chunk-fallback .boot-spinner {
        width: 28px;
        height: 28px;
        margin-top: 1.25rem;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: bootSpin 0.9s linear infinite;
      }
      .app-route-chunk-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-route-chunk-fallback .boot-spinner {
        margin-top: 0;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <meta charset="UTF-8" />
    <!-- Google Search Console: paste the verification meta tag here when you have it -->
    <!-- Bump ?v= when replacing public/favicon.png or app-icon.png (browsers cache favicons hard). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=20260603" sizes="1024x1024" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png?v=20260603" />
    <link rel="apple-touch-icon" href="/app-icon.png?v=20260603" />
    <link rel="preload" href="/app-icon.png?v=20260603" as="image" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Match app-icon gradient start (#667eea), not burgundy UI accent — Add to Home Screen splash -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260603" />
    <meta name="description" content="Mulligan — Meet cool people. Actually hangout." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Mulligan</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" aria-live="polite" aria-busy="true">
        <img src="/app-icon.png?v=20260603" width="72" height="72" alt="" />
        <h1>Mulligan</h1>
        <p>Starting Mulligan…</p>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        window.addEventListener("vite:preloadError", function (e) {
          if (e && e.preventDefault) e.preventDefault();
        });
        var RELOAD_KEY = "mulligan:pwa-boot-reload";
        function showBootError(msg) {
          var el = document.getElementById("boot-fallback");
          if (!el) return;
          el.setAttribute("aria-busy", "false");
          el.innerHTML =
            '<img src="/app-icon.png?v=20260603" width="72" height="72" alt="" />' +
            "<h1>Mulligan</h1>" +
            "<p>" + msg + "</p>" +
            '<button type="button" id="boot-reload-btn" style="margin-top:1rem;padding:0.65rem 1.2rem;border:none;border-radius:999px;background:#fff;color:#4f46e5;font-weight:700;font-size:0.95rem;">Reload</button>';
          var btn = document.getElementById("boot-reload-btn");
          if (btn) btn.addEventListener("click", function () { window.location.reload(); });
        }
        window.__MULLIGAN_SHOW_BOOT_ERROR__ = showBootError;
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            try {
              if (sessionStorage.getItem(RELOAD_KEY) !== "1") {
                sessionStorage.setItem(RELOAD_KEY, "1");
                window.location.reload();
                return;
              }
            } catch (err) { /* ignore */ }
            showBootError("Update needed — tap Reload to open Mulligan.");
          }
        }, true);
        function isStaleChunkMsg(msg) {
          return msg && (
            msg.indexOf("_result.default") !== -1 ||
            msg.indexOf("Route chunk failed to load") !== -1 ||
            msg.indexOf("missing default export") !== -1 ||
            msg.indexOf("dynamically imported module") !== -1 ||
            msg.indexOf("Importing a module script failed") !== -1 ||
            msg.indexOf("error loading dynamically imported module") !== -1
          );
        }
        window.addEventListener("unhandledrejection", function (e) {
          try { sessionStorage.removeItem(RELOAD_KEY); } catch (err) { /* ignore */ }
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || "";
          if (isStaleChunkMsg(msg)) {
            try {
              var attemptsKey = "mulligan:chunk-reload-attempts";
              var attempts = parseInt(sessionStorage.getItem(attemptsKey) || "0", 10);
              if (attempts < 2) {
                sessionStorage.setItem(attemptsKey, String(attempts + 1));
                sessionStorage.setItem("mulligan:chunk-reload", "1");
                var freshUrl = new URL(window.location.href);
                freshUrl.searchParams.set("_fresh", String(Date.now()));
                window.location.replace(freshUrl.toString());
                return;
              }
            } catch (err) { /* ignore */ }
          }
          if (!document.getElementById("boot-fallback")) return;
          showBootError("Could not start Mulligan. " + (msg || "Unknown error"));
        });
        setTimeout(function () {
          var el = document.getElementById("boot-fallback");
          if (!el) return;
          var p = el.querySelector("p");
          if (p && window.__MULLIGAN_ENTRY_LOADED__) {
            p.textContent = "Downloading Mulligan…";
          }
        }, 5000);
        setTimeout(function () {
          if (!document.getElementById("boot-fallback")) {
            try { sessionStorage.removeItem(RELOAD_KEY); } catch (err) { /* ignore */ }
            return;
          }
          showBootError("Taking longer than usual — tap Reload to try again.");
        }, 90000);
      })();
    </script>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
